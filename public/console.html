<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGO 任务控制台</title>
<style>
  :root {
    --bg:#0e1116; --bg2:#12161d; --panel:#171c24; --panel2:#1c222c;
    --line:#242c38; --line2:#2d3744;
    --fg:#e6ecf5; --dim:#93a0b4; --dim2:#6b7889;
    --acc:#4da3ff; --acc2:#7cc0ff; --acc-d:#1b6fd6;
    --ok:#3ecf6e; --warn:#f0b143; --err:#ef5b68; --info:#4da3ff;
    --radius:12px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:14px/1.55 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
         background:radial-gradient(1200px 600px at 70% -10%, #16202e 0%, var(--bg) 55%) fixed, var(--bg);
         color:var(--fg); min-height:100vh; }
  ::selection { background:rgba(77,163,255,.35); }
  a { color:var(--acc2); text-decoration:none; } a:hover { text-decoration:underline; }

  /* ---------- header ---------- */
  header { position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
           background:rgba(14,17,22,.82); border-bottom:1px solid var(--line);
           padding:10px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:30px; height:30px; border-radius:9px; flex:none;
          background:linear-gradient(135deg,var(--acc) 0%,var(--acc-d) 100%);
          display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;
          box-shadow:0 2px 8px rgba(27,111,214,.45); }
  .brand h1 { font-size:15.5px; margin:0; letter-spacing:.2px; }
  .brand .ver { color:var(--dim2); font-size:11px; font-family:ui-monospace,Consolas,monospace; }
  .headRight { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:4px 12px; border-radius:999px;
          font-size:12px; border:1px solid var(--line2); background:var(--panel); color:var(--dim); }
  .pill i { width:7px; height:7px; border-radius:50%; background:var(--dim2); }
  .pill.online i { background:var(--ok); box-shadow:0 0 6px var(--ok); animation:pulse 2s infinite; }
  .pill.offline i { background:var(--err); }
  @keyframes pulse { 50% { opacity:.45; } }
  .linkBtn { padding:5px 12px; border-radius:8px; border:1px solid var(--line2); background:var(--panel);
             color:var(--acc2); font-size:12.5px; cursor:pointer; transition:.15s; }
  .linkBtn:hover { border-color:var(--acc); background:rgba(77,163,255,.1); text-decoration:none; }

  /* ---------- layout ---------- */
  main { display:grid; grid-template-columns:minmax(350px,470px) minmax(0,1fr); gap:16px;
         padding:18px 20px 40px; align-items:start; max-width:1460px; margin:0 auto; }
  @media (max-width:980px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
           box-shadow:var(--shadow); padding:16px 18px; min-width:0; }
  .panelHead { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .panelHead h3 { margin:0; font-size:14.5px; }
  .panelHead .tag { margin-left:auto; color:var(--dim2); font-size:11.5px; }

  /* ---------- form ---------- */
  label { display:block; margin:10px 0 4px; color:var(--dim); font-size:12px; font-weight:500; }
  input, select, textarea, button { font:inherit; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width:100%; background:var(--bg2); color:var(--fg); border:1px solid var(--line2);
    border-radius:8px; padding:9px 11px; font-size:13.5px; transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc);
    box-shadow:0 0 0 3px rgba(77,163,255,.18); }
  /* 主题化按钮：与输入框同尺寸/圆角/焦点环，primary 与提交按钮同渐变 */
  .btn { padding:9px 14px; background:var(--bg2); color:var(--fg); border:1px solid var(--line2);
         border-radius:8px; font-size:13.5px; cursor:pointer; white-space:nowrap;
         transition:border-color .15s, box-shadow .15s, background .15s; }
  .btn:hover { border-color:var(--acc); background:rgba(77,163,255,.10); color:var(--acc2); }
  .btn:focus-visible { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(77,163,255,.18); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:linear-gradient(135deg,var(--acc) 0%,var(--acc-d) 100%); color:#fff;
                 border-color:transparent; font-weight:600; box-shadow:0 3px 12px rgba(27,111,214,.35); }
  .btn.primary:hover { filter:brightness(1.12); color:#fff; }
  .drop .dirLink { display:inline-block; margin:0 2px; padding:1px 10px; border-radius:999px;
    border:1px solid var(--line2); background:var(--bg2); color:var(--acc2); font-size:11.5px;
    text-decoration:none; position:relative; z-index:2; cursor:pointer; }
  .drop .dirLink:hover { border-color:var(--acc); background:rgba(77,163,255,.16); }
  select { appearance:none; -webkit-appearance:none; padding-right:30px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%2393a0b4' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 11px center; cursor:pointer; }
  textarea { font:12px/1.5 ui-monospace,Consolas,monospace; resize:vertical; min-height:84px; }
  #jsonBox { min-height:190px; }
  .hint { color:var(--dim2); font-size:11px; margin-top:3px; }
  .hint:empty { display:none; }
  .hint.bad { color:var(--err); }
  input.bad { border-color:var(--err); box-shadow:0 0 0 3px rgba(239,91,104,.15); }
  ::placeholder { color:var(--dim2); opacity:.8; }
  /* number inputs: drop the native light spin arrows (clash with dark theme);
     keyboard ↑/↓ stepping still works */
  input[type=number] { appearance:textfield; -moz-appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; appearance:none; margin:0; }

  /* unified field help: ⓘ at the right edge of every control, hover → floating tip */
  .iw { display:flex; align-items:center; gap:6px; }
  .iw > :first-child { flex:1; min-width:0; }
  .iw.ta { align-items:flex-start; }
  .iw.ta .info { margin-top:10px; }
  .info { flex:none; width:16px; height:16px; border-radius:50%; border:1px solid var(--line2);
          color:var(--dim2); text-align:center; cursor:help; user-select:none;
          font:italic 600 11px/15px Georgia,'Times New Roman',serif; }
  .info:hover, .info:focus { border-color:var(--acc); color:var(--acc); outline:none; }
  #tipBox { position:fixed; display:none; z-index:1000; max-width:300px; white-space:pre-line;
            background:#0c1420; border:1px solid var(--line2); border-radius:8px; padding:8px 11px;
            font:12px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--fg);
            box-shadow:0 8px 26px rgba(0,0,0,.5); pointer-events:none; }

  /* toggle switch — styled directly on the native checkbox so programmatic
     check()/uncheck() and label clicks keep working */
  .chk { display:flex; align-items:center; gap:9px; margin-top:11px; cursor:pointer; user-select:none; }
  .chk input { appearance:none; -webkit-appearance:none; width:34px; height:19px; flex:none;
               border-radius:999px; background:#2b3543; cursor:pointer; position:relative;
               transition:background .18s; margin:0; }
  .chk input::after { content:''; position:absolute; top:2.5px; left:3px; width:14px; height:14px;
                      border-radius:50%; background:#9fb0c4; transition:left .18s, background .18s; }
  .chk input:checked { background:var(--acc-d); }
  .chk input:checked::after { left:17px; background:#fff; }
  .chk input:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(77,163,255,.3); }
  .chk label { margin:0; color:var(--fg); font-size:13px; font-weight:400; cursor:pointer; }

  /* file dropzone */
  .drop { display:block; margin-top:4px; position:relative; }
  .drop input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .dropInner { display:flex; flex-direction:column; align-items:center; gap:4px; padding:20px 12px;
               border:1.5px dashed var(--line2); border-radius:10px; background:var(--bg2);
               transition:.18s; text-align:center; }
  .drop:hover .dropInner, .drop.drag .dropInner { border-color:var(--acc); background:rgba(77,163,255,.06); }
  .drop .ic { font-size:22px; }
  .drop .txt { font-size:13px; color:var(--dim); }
  .drop .meta { font-size:11px; color:var(--acc2); font-family:ui-monospace,Consolas,monospace; word-break:break-all; }
  .drop.drag .txt { color:var(--acc2); }
  /* 文件选择组件：上传 ↔ 服务器路径 分段切换 */
  .fpkSeg { display:inline-flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .fpkSeg button { border:0; background:transparent; color:var(--dim); padding:5px 14px; font-size:12.5px; cursor:pointer; }
  .fpkSeg button.on { background:var(--acc); color:#fff; }
  .fpkSeg button:disabled { opacity:.45; cursor:not-allowed; }
  .fpkSeg button:disabled:hover { color:var(--dim); }
  .fsRow { display:flex; gap:8px; align-items:center; margin-top:4px; }
  .fsRow input { flex:1; }
  .fsCwd { font-size:12px; color:var(--dim); word-break:break-all; margin:6px 0; }
  .fsList { max-height:50vh; overflow:auto; margin:0 0 10px; border:1px solid var(--line); border-radius:10px; }
  .fsItem { display:flex; gap:8px; align-items:center; width:100%; text-align:left; padding:7px 12px;
            background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--fg);
            cursor:pointer; font-size:13px; font-family:inherit; word-break:break-all; }
  .fsItem:hover:not(:disabled) { background:var(--bg2); }
  .fsItem:disabled { opacity:.45; cursor:default; }
  .fsItem.sel { background:rgba(77,163,255,.12); box-shadow:inset 3px 0 0 var(--acc); }
  .fsItem.used { opacity:.4; text-decoration:line-through; cursor:not-allowed; }
  .fsItem.used .sz { text-decoration:none; }
  .fsItem .sz { margin-left:auto; flex:none; color:var(--dim); font-size:11.5px; font-family:ui-monospace,Consolas,monospace; }
  .fsFtr { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  /* 浏览弹框：面包屑 / 过滤行 / 状态行 / 焦点环（服务器路径选择器优化） */
  .fsCrumbs { display:flex; flex-wrap:wrap; gap:1px; align-items:center; font-size:12px; margin:0 0 6px; }
  .fsCrumbs button { border:0; background:transparent; color:var(--acc); cursor:pointer; padding:1px 5px;
                     font-size:12px; border-radius:5px; font-family:inherit; }
  .fsCrumbs button:hover { background:var(--bg2); }
  .fsCrumbs button.cur { color:var(--fg); font-weight:600; }
  .fsCrumbs .sep { color:var(--dim2); }
  .fsBar { display:flex; gap:10px; align-items:center; margin:0 0 8px; }
  .fsBar input[type=text] { flex:1; padding:6px 10px; }
  .fsBar label { font-size:12px; color:var(--dim); display:inline-flex; gap:5px; align-items:center;
                 white-space:nowrap; cursor:pointer; user-select:none; }
  .fsEmpty { padding:16px 12px; color:var(--dim); font-size:12.5px; text-align:center; }
  .fsItem:focus-visible, .fsCrumbs button:focus-visible, .fsBar input:focus-visible {
    outline:2px solid var(--acc); outline-offset:-2px; }
  #paramForm .pathOnly[hidden], #paramForm .uploadOnly[hidden] { display:none !important; }

  /* groups */
  details.grp { border:1px solid var(--line); border-radius:10px; margin-top:10px; overflow:hidden;
                background:var(--bg2); }
  details.grp > summary { padding:10px 13px; cursor:pointer; font-size:13px; color:var(--fg);
                          background:var(--panel2); user-select:none; list-style:none;
                          display:flex; align-items:center; gap:8px; transition:background .15s; }
  details.grp > summary:hover { background:#202936; }
  details.grp > summary .chev { color:var(--dim2); font-size:10px; transition:transform .18s; }
  details.grp[open] > summary .chev { transform:rotate(90deg); }
  details.grp > summary .cnt { margin-left:auto; color:var(--dim2); font-size:11px;
                               font-family:ui-monospace,Consolas,monospace; }
  .gbody { padding:4px 14px 14px; }
  .fgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:6px 12px; }
  .fspan { grid-column:1/-1; }
  details.grp .fgrid input[type=number] { font-variant-numeric:tabular-nums; }

  /* token / json collapsibles */
  details.mini { margin-top:10px; }
  details.mini > summary { cursor:pointer; list-style:none; font-size:12px; color:var(--dim);
                           padding:6px 2px; user-select:none; display:flex; align-items:center; gap:7px; }
  details.mini > summary .chev { color:var(--dim2); font-size:10px; transition:transform .18s; }
  details.mini[open] > summary .chev { transform:rotate(90deg); }
  details.mini > summary:hover { color:var(--acc2); }

  /* submit */
  .submitRow { display:flex; align-items:center; gap:10px; margin-top:14px; }
  #submit { flex:1; padding:11px 16px; border:none; border-radius:10px; cursor:pointer;
            background:linear-gradient(135deg,var(--acc) 0%,var(--acc-d) 100%);
            color:#fff; font-size:14.5px; font-weight:600; letter-spacing:.5px;
            box-shadow:0 3px 12px rgba(27,111,214,.4); transition:.18s; display:flex; align-items:center; justify-content:center; gap:8px; }
  #submit:hover { filter:brightness(1.12); box-shadow:0 5px 16px rgba(27,111,214,.5); }
  #submit:active { transform:translateY(1px); }
  #submit:disabled { opacity:.55; cursor:wait; filter:none; }
  .spinner { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.35);
             border-top-color:#fff; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #msg { margin-top:10px; font-size:12px; min-height:0; white-space:pre-wrap; word-break:break-all;
         padding:0; display:none; }
  #msg.show { display:block; padding:9px 11px; border-radius:8px; }
  #msg.err { color:#ffb3ba; background:rgba(239,91,104,.12); border:1px solid rgba(239,91,104,.3); }
  #msg.ok { color:#b8f0cd; background:rgba(62,207,110,.1); border:1px solid rgba(62,207,110,.3); }

  /* ---------- stats + table ---------- */
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { padding:6px 12px; border-radius:9px; border:1px solid var(--line); background:var(--bg2);
          font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center; }
  .stat b { font-variant-numeric:tabular-nums; color:var(--fg); font-size:13px; }
  .scrollx { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--bg2); }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  th, td { text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  th { color:var(--dim2); font-weight:500; font-size:11.5px; letter-spacing:.4px;
       background:var(--panel2); position:sticky; top:0; white-space:nowrap; }
  tbody tr { transition:background .12s; }
  tbody tr:hover { background:rgba(77,163,255,.05); }
  /* 正在看日志的那一行：弹框遮住了列表，透出的高亮 + 关闭后还焦点，用来认回自己看的是哪个任务 */
  tbody tr.cur { background:rgba(77,163,255,.09); box-shadow:inset 3px 0 0 var(--acc); }
  tbody tr.cur .act button[data-act="log"] { border-color:var(--acc); background:rgba(77,163,255,.16); color:var(--fg); }
  td { min-width:0; }
  .jobId { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--dim);
           cursor:pointer; border-bottom:1px dashed var(--line2); }
  .jobId:hover { color:var(--acc2); }
  .tRel { display:block; color:var(--dim2); font-size:11px; margin-top:1px; }
  .typeCell { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .typeIc { font-size:14px; }
  .inName { max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--dim); }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
           font-size:11.5px; font-weight:600; white-space:nowrap; background:#242d3a; }
  .badge::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .s-queued { color:#a8b4c6; } .s-running { color:var(--warn); } .s-running::before { animation:pulse 1.2s infinite; }
  .s-succeeded { color:var(--ok); } .s-failed { color:var(--err); } .s-usage_error { color:#ff9d6b; }
  .s-canceled { color:var(--dim2); }
  .bar { height:6px; background:#2a3442; border-radius:3px; overflow:hidden; min-width:110px; }
  .bar i { display:block; height:100%; border-radius:3px; width:0%;
           background:linear-gradient(90deg,var(--acc-d),var(--acc2)); transition:width .35s; }
  .bar.run i { background:linear-gradient(90deg,var(--acc-d),var(--acc2),var(--acc-d));
               background-size:200% 100%; animation:flow 1.6s linear infinite; }
  @keyframes flow { to { background-position:-200% 0; } }
  .pct { display:block; margin-top:3px; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .act { display:flex; gap:6px; flex-wrap:nowrap; }
  .act button, .act a.btn { width:auto; padding:5px 11px; margin:0; font-size:12px; font-weight:500;
                border-radius:7px; cursor:pointer; transition:.15s; white-space:nowrap;
                background:transparent; color:var(--acc2); border:1px solid var(--line2); text-decoration:none;
                display:inline-block; text-align:center; }
  .act button:hover, .act a.btn:hover { border-color:var(--acc); background:rgba(77,163,255,.12); text-decoration:none; }
  .act button.danger:hover { border-color:var(--err); color:var(--err); background:rgba(239,91,104,.1); }
  .act button:disabled { opacity:.35; cursor:default; }
  .empty { text-align:center; padding:34px 12px; color:var(--dim2); }
  .empty .ic { font-size:30px; opacity:.6; }
  .empty p { margin:8px 0 2px; font-size:13px; }

  /* ---------- pager ---------- */
  .pager { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:11px; font-size:12px; color:var(--dim); }
  .pager:empty { display:none; }
  .pager .pInfo { color:var(--dim2); font-variant-numeric:tabular-nums; }
  .pager label { display:inline-flex; align-items:center; gap:6px; }
  .pager select { width:auto; padding:4px 26px 4px 8px; font-size:12px; }
  .pager .pBtns { margin-left:auto; display:flex; gap:5px; align-items:center; }
  .pager button { min-width:30px; padding:4px 9px; margin:0; font-size:12px; line-height:1.5; border-radius:7px;
                  cursor:pointer; background:var(--bg2); color:var(--dim); border:1px solid var(--line2); transition:.15s; }
  .pager button:hover:not(:disabled) { border-color:var(--acc); color:var(--acc2); }
  .pager button.on { background:rgba(77,163,255,.16); border-color:var(--acc); color:var(--fg); font-weight:600; cursor:default; }
  .pager button:disabled { opacity:.35; cursor:default; }
  .pager .dots { color:var(--dim2); padding:0 1px; }
  .pager .newHint { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
                    border:1px solid rgba(77,163,255,.45); background:rgba(77,163,255,.12); color:var(--acc2);
                    cursor:pointer; font-size:12px; }

  /* ---------- 任务日志：悬浮模态弹框 ---------- */
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .modal { position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
           padding:22px; background:rgba(6,9,14,.62); backdrop-filter:blur(3px); animation:mFade .16s ease-out; }
  .modal[hidden] { display:none; }
  .modal .mask { position:absolute; inset:0; cursor:zoom-out; }
  .modal .dialog { position:relative; width:min(1080px,100%); max-height:min(84vh,880px); display:flex; flex-direction:column;
                   background:var(--panel); border:1px solid var(--line2); border-radius:14px; overflow:hidden;
                   box-shadow:0 26px 70px rgba(0,0,0,.6); animation:mPop .18s cubic-bezier(.2,.8,.3,1); }
  .modal .dialog:focus { outline:none; }
  @keyframes mFade { from { opacity:0; } }
  @keyframes mPop { from { transform:translateY(12px) scale(.985); opacity:0; } }
  body.locked { overflow:hidden; }

  .logHead { display:flex; align-items:center; gap:10px; flex:none; padding:11px 15px;
             background:var(--panel2); border-bottom:1px solid var(--line); }
  .logHead h4 { margin:0; font-size:13.5px; font-weight:600; }
  .logHead .sp { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .logHead button { margin:0; padding:4px 11px; font-size:12px; border-radius:7px; cursor:pointer;
                    background:transparent; color:var(--dim); border:1px solid var(--line2); transition:.15s; }
  .logHead button:hover { color:var(--acc2); border-color:var(--acc); }
  #logBox { flex:1; min-height:0; background:#0a0d12; padding:11px 13px;
            font:11.5px/1.6 ui-monospace,Consolas,monospace; overflow:auto; overscroll-behavior:contain;
            white-space:pre-wrap; color:#a5b4c9; word-break:break-all; }
  #logBox:focus-visible { outline:2px solid var(--acc); outline-offset:-2px; }
  #logBox .t-err { color:#ff9aa2; } #logBox .t-prog { color:var(--ok); } #logBox .t-status { color:var(--acc2); }

  /* ---------- toast ---------- */
  #toasts { position:fixed; bottom:14px; right:14px; z-index:999; display:flex; flex-direction:column; gap:8px;
            max-width:min(360px, calc(100vw - 28px)); }
  .toast { display:flex; gap:9px; align-items:flex-start; padding:11px 14px; border-radius:10px;
           font-size:13px; line-height:1.45; box-shadow:var(--shadow); animation:slideIn .22s ease-out;
           border:1px solid; background:rgba(20,26,34,.96); backdrop-filter:blur(8px); min-height: 100px;
           width:max-content; max-width:min(360px, calc(100vw - 28px)); }
           /* 上面两行缺一不可：仅 max-width 时 .toast 作为 #toasts(列方向) 的 flex 子项会
              被算成 ~30px 的细条（内容全溢出盒子、超出视口），显式 width:max-content 才按
              内容取宽、再被 max-width 封顶（长 ID 自动折行）。*/
  .toast .t-msg { min-width:0; overflow-wrap:anywhere; }  /* 长 ID / 无空格串允许任意断行包裹 */
  .toast .t-ic, .toast .t-x { flex:none; }
  .toast.out { animation:fadeOut .3s forwards; }
  @keyframes slideIn { from { transform:translateX(16px); opacity:0; } }
  @keyframes fadeOut { to { transform:translateY(-6px); opacity:0; } }
  .toast .t-ic { font-size:15px; flex:none; }
  .toast.ok { border-color:rgba(62,207,110,.4); } .toast.ok .t-ic { color:var(--ok); }
  .toast.err { border-color:rgba(239,91,104,.45); } .toast.err .t-ic { color:var(--err); }

  @media (max-width:640px) {

<script type="module">
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const k of kids) { if (k == null || k === false) continue; n.append(k.nodeType ? k : document.createTextNode(k)); }
  return n;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAgo = (iso) => {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 8) return '刚刚';
  if (s < 60) return Math.floor(s) + '秒前';
  if (s < 3600) return Math.floor(s / 60) + '分钟前';
  if (s < 86400) return Math.floor(s / 3600) + '小时前';
  return Math.floor(s / 86400) + '天前';
};

/* ================ toasts ================ */
function toast(msg, type = 'info', ms = 3600) {
  const box = $('#toasts');
  const t = el('div', { class: 'toast ' + type },
    el('span', { class: 't-ic' }, { ok: '✓', err: '✕', info: 'ℹ' }[type] || 'ℹ'),
    el('span', { class: 't-msg' }, msg),
    el('span', { class: 't-x', onclick: () => { t.classList.add('out'); setTimeout(() => t.remove(), 300); } }, '✕'));
  box.append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms);
}

/** 复制到剪贴板，返回是否成功。
 * 剪贴板 API 只在安全上下文（https 或 localhost）存在；控制台常被内网用
 * http://<IP> 打开——此时 navigator.clipboard 直接是 undefined，旧代码
 * 静默吞掉后还弹"已复制"，纯属误导。这里先走 Clipboard API，不行就退回
 * 传统的隐藏 textarea + execCommand('copy')，最后如实告知结果。 */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch { /* 掉进兜底 */ }
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = String(text ?? '');
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
    document.body.append(ta);
    const sel = document.getSelection(); const prev = sel?.rangeCount ? sel.getRangeAt(0) : null;
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (prev) { sel.removeAllRanges(); sel.addRange(prev); }
    return ok;
  } catch { return false; }
}

/* ================ client IP / whitelist note ================ */
const ipNote = () => {
  const n = $('#ipNote');
  if (!n || !caps?.client) return;
  const { ip, allowed } = caps.client;
  n.innerHTML = allowed
    ? `🟢 IP <b>${esc(ip)}</b> `
    : `🔴 IP <b>${esc(ip)}</b> 未在白名单，提交会被拒绝（可在白名单页添加）`;
};
const showMsg = (text, kind) => {
  const m = $('#msg');

  m.className = kind || '';

};

/* ================ field spec ================ */
const ICONS = { tiles: '🏗', terrain: '⛰', image: '🛰', geojson: '📍', mesh: '🧊', osgb: '📷' };
const DESC = {
  tiles: '模型（FBX/OBJ 等，支持多文件）→ 3D Tile，可配准、简化；多文件统一参数转换后自动合并 tileset.json',
  terrain: 'DEM GeoTIFF → Cesium 地形瓦片',
  image: '正射影像 GeoTIFF → TMS 瓦片',
  geojson: 'GeoJSON → EPSG:4326',
  mesh: '模型分组简化 / 格式转换（glb · obj · fbx）',
  osgb: 'OSGB 倾斜摄影 → 3D Tiles',
};
const TYPE_CN = {
  tiles: '模型转 3D Tiles', terrain: '地形切片', image: '影像切片',
  geojson: '坐标转换', mesh: '模型简化', osgb: '倾斜摄影',
};
const F = (k, t, label, o = {}) => ({ k, t, label, ...o });
/* select 值的中文注释（value 不变，仅显示更直观） */
const OPT_CN = {
  '7param': '七参数', multipos: '控制点拟合', anchor: '锚点',
  original: '原始坐标', left: '左手坐标系',
  ADD: '叠加细化', REPLACE: '替换细化',
};
const gProj = () => el2('投影', [
  F('proj.crs', 'text', '输入数据坐标系', { span: true, ph: 'EPSG:4547 / WKT / +proj=…', hint: '声明输入数据所用的坐标系（EPSG 代码 / WKT / proj4 字符串）' }),
  F('@prj', 'file', '或上传 .prj / .wkt 文件', { accept: '.prj,.wkt,.proj', span: true, uploadOnly: true, hint: '提供投影定义文件（「⬆ 上传」模式），上传后忽略上方文本框' }),
  F('proj.prjPath', 'pathtext', '或选择服务器投影文件（.prj / .wkt / .proj）', {
    span: true, pext: '.prj,.wkt,.proj', ph: '/data/prj/cgcs2000.prj',
    hint: '「🖥 服务器路径」模式专用：浏览选取服务器本地投影定义文件（限 MGO_ALLOWED_ROOTS），选后忽略上方文本框；JSON 手改模式可直接写 proj.prjPath',
  }),
]);
const gOrigin = (label = '坐标原点') => el2(label, [
  F('origin', 'vec3', 'Origin', { subs: ['E/X (m)', 'N/Y (m)', 'H (m)'], hint: '输出瓦片网格的原点坐标（局部坐标 → 地心的平移量）' }),
]);
const gGeoref = ({ meshOffset = false } = {}) => {
  const g = el2('地理配准', [
    F('georef.mode', 'select', '配准方式', { opts: ['', '7param', 'multipos', 'anchor'], hint: '把源数据对齐到目标坐标系的方法；留空 = 按已填参数自动判定' }),
    F('georef.fitOrder', 'select', '拟合阶数', { opts: ['', '1', '2', '3'], hint: '控制点拟合多项式阶数：1=刚性/相似，2=二次，3=三次；点数少时用 1' }),
    F('georef.autoCrs', 'bool', '自动识别源坐标系', { hint: '让 CLI 尝试从数据 / sidecar 文件识别源 CRS' }),
    F('georef.sevenParameter', 'seven', '七参数', { span: true, hint: 'Helmert 七参数：3 平移 + 3 旋转 + 1 尺度，用于不同大地坐标系间的转换',
      subs: [['mx', null, '平移 (m)'], ['my', null, '平移 (m)'], ['mz', null, '平移 (m)'],
             ['rx', null, '旋转 (角秒)'], ['ry', null, '旋转 (角秒)'], ['rz', null, '旋转 (角秒)'],
             ['s', null, '尺度 (ppm)']] }),
    F('georef.controlPoints', 'area', '控制点 CSV 文本（源 → 目标）', { span: true, hint: '每行一条：源X,源Y,源Z,目标X,目标Y,目标Z（逗号或空格分隔），至少 3 条' }),
    F('@cps', 'file', '或上传控制点 .csv', { accept: '.csv,.txt', span: true, uploadOnly: true, hint: '内容与上方文本框相同，来自文件时优先生效' }),
  ]);
  if (meshOffset) g.fields.push(F('georef.offset', 'vec3', '投影偏移', { subs: [['dE', null, '米'], ['dN', null, '米'], ['dH', null, '米']], hint: '配准完成后的整体平移量（米），用于微调成果位置' }));
  return g;
};
const gSimplify = ({ local = false, errPh = '留空=不简化' } = {}) => {
  const g = el2('简化', [
    F('simplify.error', 'num', '误差 error', { ph: errPh, min: 0, max: 1, hint: '简化允许的几何偏差；值越大保留的面越少、速度越快' }),
    F('simplify.normalWeight', 'num', '法线权重', { ph: '默认 0.1', min: 0, max: 1, hint: '简化时保持法线方向的权重；越大光照越平滑稳定' }),
    F('simplify.threshold', 'num', '三角面比例', { ph: '默认 0.1', min: 0, hint: '面合并的判定比例；越大简化越保守' }),
    // mesh 的 -L 是带值布尔且 CLI 默认开 → 默认勾选；其余类型默认关
    F('simplify.lockBorder', 'bool', '锁边', local ? { def: true, hint: '固定开放边界与接缝顶点，防止简化后模型出现裂缝' } : { hint: '固定开放边界与接缝顶点，防止简化后模型出现裂缝' }),
  ]);
  if (local) g.fields.push(F('simplify.localError', 'bool', '按绝对误差简化', { hint: '误差按绝对值（米）逐网格判定，而非相对整模型尺寸' }));
  return g;
};
function el2(name, fields) { return { name, fields }; }

const UI = {
  tiles: () => [gProj(), gOrigin(), gGeoref(), gSimplify()],
  terrain: () => ([
    { name: '地形参数', fields: [
      F('maxLod', 'int', '最大层级 LOD', { ph: '留空=自动', min: 1, hint: '地形瓦片细分到第几级；越大越精细，输出量级成倍增加' }),
      F('samplesPerTile', 'int', '每瓦片采样数', { ph: '65', min: 2, max: 255, odd: true, hint: '每个地形瓦片的网格采样点数（须为奇数，如 33/65/129/257）' }),
      F('normals', 'bool', '导出顶点法线', { def: true, hint: '输出法线数据，地形光照更平滑（体积略增大）' }),
    ]},
    gOrigin('坐标原点'), gProj(), gGeoref(),
    gSimplify({ local: false, errPh: '留空=0.001' }),
  ]),
  image: () => [gProj()],
  geojson: () => ([{ name: '转换参数（输出默认转经纬度）', fields: [
    F('sourceCrs', 'text', '源坐标系', { span: true, ph: 'EPSG:4547 / ENU:lat,lon / WKT / +proj=' , hint: '留空则读文件内 crs 成员，均无时按经纬度处理；目标坐标系固定为 EPSG:4326，无需设置' }),
    F('pretty', 'bool', '格式化输出 JSON', { hint: '缩进排版输出文件，便于阅读（体积略增大）' }),
  ]}]),
  mesh: () => ([
    { name: '输出', fields: [
      F('outputFormat', 'select', '输出格式', { opts: ['glb', 'gltf', 'obj', 'fbx', 'ply'], hint: '目标模型格式；glb 为二进制单文件，最通用' }),
      F('coordMode', 'select', '输出坐标系', { opts: ['', 'original', 'left'], hint: 'original=保持原始坐标，left=转左手系；默认自动转地心坐标' }),
      F('reorder', 'bool', '顶点重排优化（减小体积）', { hint: '按空间邻接重排顶点顺序，压缩率更高、加载更快' }),
      F('rebuild', 'bool', '加载时重建场景', { hint: '加载输入时强制重建场景图，用于排查异常结构' }),
      F('@cfg', 'file', '或上传逐构件简化配置 CSV（按名称匹配）', { accept: '.csv,.txt', span: true, uploadOnly: true, hint: '每行：构件名,误差 —— 为不同构件单独指定简化力度' }),
    ]},
    gProj(), gGeoref({ meshOffset: true }), gSimplify({ local: true }),
  ]),
  osgb: () => ([
    { name: 'OSGB', fields: [
      F('maxLod', 'int', '最大层级 LOD', { ph: '留空=自动', min: 1, hint: '模型瓦片最大细分层级；越大越精细，耗时成倍增加' }),
      F('enu', 'vec3', 'ENU 参考点（覆盖自动计算）', {
        subs: [['纬度°', { min: -90, max: 90 }], ['经度°', { min: -180, max: 180 }], ['高程 m', null]],
        span: true, hint: '转站参考点（模型所在地理位置）；留空 = 从 OSG 元数据自动计算',
      }),
    ]},
    gOrigin(), gProj(), gGeoref(), gSimplify(),
  ]),
};
const BASIC = {
  tiles: [
    { name: '3D Tiles', fields: [
      F('zUp', 'bool', 'Y-up ↔ Z-up', { span: true, hint: '仅当源模型坐标已符合测量惯例（Z 轴向上）时勾选' }),
    ]},
    { name: '分块与 LOD', fields: [
      F('rootGeometricError', 'num', '根几何误差（米）', { ph: '留空=按包围盒自动', pos: true, hint: '最粗一级瓦片的屏幕误差预算；越大首屏越快、远景越糊' }),
      F('tileGeometricError', 'num', '瓦片几何误差（米）', { ph: '留空=自动', pos: true, hint: '相邻 LOD 层级间的误差步进' }),
      F('refine', 'select', '细化模式', { opts: ['', 'ADD', 'REPLACE'], hint: 'ADD=子瓦片叠加在父瓦片上（地形常用），REPLACE=子瓦片替换父瓦片（白模常用）' }),
      F('minBlockDistance', 'num', '最小分块距离（米）', { ph: '留空=自动', pos: true, hint: '两物体距离小于此值时合并为一块，不再细分' }),
      F('maxLod', 'int', '最大层级 LOD', { ph: '留空=自动', min: 1, hint: '模型瓦片最大细分层级；越大越精细，耗时成倍增加' }),
    ]},
  ],
};

/* ================ input area ================ */
let caps = null;
/* ============ FilePicker 组件 ================
 * 单一输入控件，内含分段切换（服务器开启本地路径时）：

/* FilePicker 组件状态：picker=当前实例；treePick=「文件树」选择态
 * （null=普通文件；数组 [{file, rel}] 时 rel 保留目录结构，走 relPaths 通道） */
let picker = null;
let treePick = null;
async function walkEntry(entry, prefix, out) {
  if (!entry) return;
  if (entry.isFile) {
    const f = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file: f, rel: prefix + entry.name });
  } else if (entry.isDirectory) {
    const rd = entry.createReader();
    let all = []; let batch;
    do { batch = await new Promise((res) => rd.readEntries(res, () => res([]))); all = all.concat(batch); } while (batch.length);
    for (const ch of all) await walkEntry(ch, prefix + entry.name + '/', out);
  }
}
function updateDrop() {
  const meta = $('#dropMeta');
  if (!meta) return;
  const size = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  if (treePick?.length) {
    const total = treePick.reduce((s, t) => s + t.file.size, 0);
    const top = String(treePick[0].rel).split('/')[0];
    meta.textContent = `🗂 ${top}/ · ${treePick.length} 个文件 · ${size(total)}（树结构保留，贴图可解析）`;
    return;
  }
  const fi = $('#file');
  const fs = fi && fi.files ? [...fi.files] : [];
  if (!fs.length) { meta.textContent = ''; return; }
  if (fs.length === 1) {
    meta.textContent = /\.zip$/i.test(fs[0].name)
      ? `${fs[0].name} · ${size(fs[0].size)}（ZIP 文件树）`
      : `${fs[0].name} · ${size(fs[0].size)}`;
    return;
  }
  const total = fs.reduce((s, f) => s + f.size, 0);
  const shown = fs.slice(0, 3).map((f) => f.name).join('、');
  meta.textContent = `${fs.length} 个文件 · ${size(total)}（${shown}${fs.length > 3 ? '…' : ''}）`;

const fileAccept = (t) => ({ tiles: '.fbx,.obj,.gltf,.glb,.dae,.3ds,.ply,.stl',

  image: '.tif,.tiff', geojson: '.geojson,.json' })[t] ?? '';

/* ---- pathOnly 字段（如 proj.prjPath）仅在「🖥 服务器路径」模式 + 服务器开启

 * 投影文件优先：prjPath 或上传 @prj 有值时禁用 CRS 文本框（镜像服务端

/* ---- 服务器目录浏览选径（只读；受 MGO_ALLOWED_ROOTS + 白名单 IP 约束） ----
 * 通用选择弹框（输入文件 / 投影 side-car / 整目录共用）。
 * sel 存【绝对路径】：旧版存裸文件名、确认时按当时的 cwd 拼接——进入子目录
 * 再「加入选中」会拼出错误路径，且同名文件跨目录误高亮。现在选择跨目录
 * 保留、路径即所见即所得。 */

}
async function fsBrowse(p) {

/**
 * 打开浏览弹框。type 推导默认策略；opts 可整体覆盖：
 * {exts, allowDir, multi, title, start}。投影行传

function openFsBrowser(type, inputEl, opts = {}) {
  fsState.input = inputEl; fsState.sel = []; fsState.last = null;

  fsState.allowDir = opts.allowDir ?? (type === 'osgb' || type === 'tiles' || type === 'mesh'); // 可选整目录（树模式）
  // NOTE: server-path browse lists model FILES / FOLDERS only — no .zip.  ZIP
  // is an upload-channel input (server extracts it); a server-side path to a

  fsState.exts = opts.exts ?? ((type === 'osgb' || type == null) ? []

function fsClose() {

function fsRender() {

  const st = $('#fsCwd');

    if (fsState.err) {

        el('button', { class: 'fsItem', onclick: () => fsLoad(fsState.errReq ?? '') }, '↻ 重试本目录'),

    ? (fsState.sel.length ? `已选 ${fsState.sel.length} 个（跨目录保留）` : '可点选多个文件，再「加入选中」')

function rangeHint(f) {
  const p = [];

  else if (f.min != null) p.push(`≥ ${f.min}`);

  if (f.t === 'int' && !Number.isInteger(x)) return '需为整数';
  if (f.odd && Math.abs(x) % 2 === 0) return '取值需为奇数 (odd)';
  if (f.min != null && x < f.min) return `不能小于 ${f.min}`;

  const parts = k.split('.'); const last = parts.pop();

function collect() {
  const type = $('#type').value;
  const params = { type };
  const files = {};
  for (const node of $('#paramForm').querySelectorAll('[data-k]')) {
    const k = node.dataset.k;
    if (k.startsWith('@')) { if (node.files?.[0]) files[k.slice(1)] = node.files[0]; continue; }
    if (node.disabled) continue;            // 被投影文件压制的 crs 不收集
    if (k === 'proj.prjPath' && picker?.getMode?.() !== 'path') continue; // 仅路径模式携带
    if (node.type === 'checkbox') {
      if (k === 'normals') { if (!node.checked) params.normals = false; continue; }
      // mesh -L defaults ON in the CLI, so an explicit false opts out;
      // other types' --lock-border is a bare flag (only forward when checked)
      // NOTE: the field key is simplify.lockBorder — matching plain
      // "lockBorder" here never fired, so unchecking 锁边 could not disable it.
      if (k === 'simplify.lockBorder' && type === 'mesh') { setPath(params, k, node.checked); continue; }
      if (node.checked) setPath(params, k, true);
      continue;
    }
    const v = node.value.trim();
    if (!v) continue;
    if (node.type === 'number') setPath(params, k, Number(v));
    else if (k === 'georef.fitOrder') setPath(params, k, Number(v));
    else setPath(params, k, v);
  }
  for (const [key, n] of [['origin', 3], ['georef.sevenParameter', 7], ['georef.offset', 3], ['enu', 3]]) {
    const nodes = [...$('#paramForm').querySelectorAll(`[data-vec="${key}"]`)];
    if (!nodes.length) continue;
    const vals = nodes.map(x => x.value.trim());
    if (vals.every(x => x !== '')) setPath(params, key, vals.map(Number));
  }
  return { params, files };
}

const VEC_CN = { origin: '坐标原点', enu: 'ENU 参考点', 'georef.sevenParameter': '七参数', 'georef.offset': '投影偏移' };
function validateForm() {
  const errs = [];

    if (e) { paintField(n); errs.push(`${n.closest('.fcell').querySelector('label').textContent}：${e}`); }
  }
  for (const key of Object.keys(VEC_CN)) {
    const nodes = [...$('#paramForm').querySelectorAll(`[data-vec="${key}"]`)];
    if (!nodes.length) continue;
    const filled = nodes.filter((n) => n.value.trim() !== '').length;
    if (filled && filled < nodes.length) errs.push(`${VEC_CN[key]}：${nodes.length} 个值需填全，或全部留空`);
    for (const n of nodes) {
      if (!n._f) continue;
      const e = specError(n._f, n.value);
      if (e) { paintField(n); errs.push(`${VEC_CN[key]} ${e}`); }
    }
  }

let jobsTotal = null;   // 服务端任务总数（列表只拉当前页）

    if (!force) return loading;

}
async function fetchPage() {
  const offset = (page - 1) * pageSize;
  try {
    const [listR, mxR] = await Promise.all([
      fetch(`/api/v1/jobs?limit=${pageSize}&offset=${offset}`),
      fetch('/api/v1/metrics').catch(() => null),
    ]);
    if (!listR.ok) return;
    const o = await listR.json();
    listTotal = Number.isFinite(+o.total) ? +o.total : o.items.length;
    jobsTotal = listTotal;                                   // 先用列表权威总数兜底
    pages = Math.max(1, Math.ceil(listTotal / pageSize));
    if (page > pages) { page = pages; return fetchPage(); }   // 删完最后一页后越界：夹回末页
    if (mxR?.ok) {
      const mx = await mxR.json().catch(() => null);
      if (mx?.jobs) { jobStats = mx.jobs.byStatus ?? null; jobsTotal = mx.jobs.total ?? jobsTotal; }
    }
    // 服务端为权威，整页替换：旧的"只 set 不清"在分页下会把别页的行留在表里
    jobs.clear();
    o.items.forEach(j => jobs.set(j.id, j));

    if (prevTotal != null && t < prevTotal) return loadJobs();   // 别处删了任务：当前页可能已空，老实重取
    listTotal = t;
    pages = Math.max(1, Math.ceil(listTotal / pageSize));
    if (mx?.jobs) { jobStats = mx.jobs.byStatus ?? null; jobsTotal = mx.jobs.total ?? t; }
    else jobsTotal = t;
    trackNew();
    renderStats([...jobs.values()]);   // 统计条保持实时，表格行不重排
    renderPager();
  } catch { /* 离线：健康探针负责 */ }
}
/* ---------------- pager ---------------- */
function pageWindow(cur, n) {   // 1 … 4 5 [6] 7 8 … 20
  const out = [];
  for (let i = 1; i <= n; i++) {
    if (i === 1 || i === n || Math.abs(i - cur) <= 1) out.push(i);
    else if (out[out.length - 1] !== '…') out.push('…');
  }
  return out;
}
let pagerSig = '';
function renderPager() {
  const box = $('#pager');
  if (!listTotal) { box.innerHTML = ''; pagerSig = ''; return; }
  const sig = [page, pages, pageSize, listTotal, pendingNew].join('|');
  if (sig === pagerSig && box.firstChild) return;   // 5s 轮询别重建 DOM（会把展开中的下拉打断）
  pagerSig = sig;
  const from = (page - 1) * pageSize + 1, to = Math.min(page * pageSize, listTotal);
  const num = (p) => p === '…' ? '<span class="dots">…</span>'
    : `<button data-page="${p}"${p === page ? ' class="on" aria-current="page"' : ''} title="第 ${p} 页">${p}</button>`;
  const edge = (p, label, title, off) =>
    `<button data-page="${p}" title="${title}"${off ? ' disabled' : ''}>${label}</button>`;
  box.innerHTML = `<span class="pInfo">第 ${from}–${to} 条 / 共 ${listTotal} 条</span>
    <label class="pInfo">每页<select id="pageSizeSel" title="每页显示条数">${
      PAGE_SIZES.map((s) => `<option value="${s}"${s === pageSize ? ' selected' : ''}>${s}</option>`).join('')
    }</select>条</label>
    ${pendingNew ? `<button class="newHint" data-new="1" title="跳转到第 1 页">↑ ${pendingNew} 个新任务</button>` : ''}
    <span class="pBtns" role="group" aria-label="分页">${
      edge(1, '«', '首页', page === 1) + edge(page - 1, '‹', '上一页', page === 1)
    }${pageWindow(page, pages).map(num).join('')}${
      edge(page + 1, '›', '下一页', page === pages) + edge(pages, '»', '末页', page === pages)
    }</span>`;
}

  catch { return null; }
};
function toggleModalChrome(on, modal = logModal) {
  const b = document.body;
  if (on) {
    const gap = window.innerWidth - document.documentElement.clientWidth;   // 先量滚动条宽度再锁
    b.style.paddingRight = gap > 0 ? `${gap}px` : '';
    b.classList.add('locked');
  } else {
    b.classList.remove('locked');
    b.style.paddingRight = '';
  }
  // 背景整体 inert：不进 Tab 序、读屏也不播（不支持该属性的浏览器忽略即可，焦点圈仍由 keydown 兜住）。
  // modal 参数化：日志弹框与目录浏览弹框共用同一套锁滚/遮罩语义。
  for (const n of b.children) {
    if (n.tagName === 'SCRIPT' || n === modal || n.id === 'toasts') continue;
    n.inert = on;
  }
}

async function openLog(id) {
  const gen = ++logGen;
  logJobId = id;
  logModal.hidden = false;
  toggleModalChrome(true);
  $('#logJob').textContent = '#' + id.slice(0, 8);
  logBadge(jobs.get(id)?.status);   // 徽章跟着任务真实状态走，不再恒为"运行中"黄
  $('#logBox').textContent = '';
  if (es) { es.close(); es = null; }
  render();                                     // 标记正在看日志的行
  logDialog.focus({ preventScroll: true });     // 键盘/Esc 立刻可用
  const stale = () => gen !== logGen || logJobId !== id;
  // 实时行必须是真实 <span> 元素（Element.append 收到字符串只会当纯文本插入，
  // 曾导致 <span …> 包装标签原样露在日志里、颜色类从未生效）
  const logSpan = (cls, text) => {
    const box = $('#logBox');
    if (cls) {
      const s = document.createElement('span');
      s.className = cls;
      s.textContent = text;
      box.append(s, '\n');
    } else box.append(`${text}\n`);
  };
  // 终态任务没有"实时"可言：run.log 历史已完整，挂 SSE 只会把事件缓冲区
  // 重放一遍——模块行/进度在历史里都已出现，用户看到同样内容两遍。
  const TERMINAL_ST = ['succeeded', 'failed', 'canceled', 'usage_error'];
  const wasTerminal = TERMINAL_ST.includes(jobs.get(id)?.status);
  // render history FIRST, then attach EventSource — otherwise a late fetch
  // callback clobbers live [progress] lines already appended (was a real race)
  try {
    // 弹框比原来的内嵌面板高得多，历史行数相应放宽（服务端 tail 上限 2000）
    const o = await (await fetch(`/api/v1/jobs/${id}/log?tail=300`)).json();
    if (stale()) return;                        // 弹框已切到别的任务：别覆盖
    $('#logBox').textContent = (o.lines || []).join('\n')
      + (wasTerminal ? '\n' : '\n—— 以下为实时日志 ——\n');
  } catch {
    if (stale()) return;
    $('#logBox').textContent = wasTerminal ? '' : '—— 实时日志 ——\n';
  }
  scroll();
  if (wasTerminal) {
    // 打开瞬间恰好完成的竞态：以服务端权威状态纠正徽章/行，并补一行终态
    try {
      const j = await (await fetch(`/api/v1/jobs/${id}`)).json();
      if (stale()) return;
      const row = jobs.get(id);
      if (row && j.status !== row.status) { row.status = j.status; render(); }
      logBadge(j.status);
      logSpan('t-status', `[status] ${j.status}`);
      scroll();
    } catch { /* 服务离线：历史已在，徽章保持打开时的值 */ }
    return;
  }
  if (stale()) return;                          // fetch 期间被 closeLog/重开：不再挂流
  es = new EventSource(`/api/v1/jobs/${id}/events`);
  es.addEventListener('log', (m) => {
    const line = JSON.parse(m.data).line;
    const cls = /\[(?:Progress|Done)\]/.test(line) ? 't-prog' : (/^Error|错误|warning/i.test(line) ? 't-err' : '');
    logSpan(cls, line); scroll();
  });
  es.addEventListener('progress', (m) => {
    const d = JSON.parse(m.data);
    const j = jobs.get(id); if (j) { j.progress = d.data; j.status = 'running'; render(); }
    logSpan('t-prog', `[progress] ${d.data.done}/${d.data.total} (${d.data.percent}%)`); scroll();
  });
  es.addEventListener('status', (m) => {
    const d = JSON.parse(m.data); const j = jobs.get(id);
    if (j) { j.status = d.status; if (d.artifacts) { j.artifacts = d.artifacts; j.viewerUrl = d.viewerUrl; } render(); }
    logBadge(d.status);
    logSpan('t-status', `[status] ${d.status}`); scroll();
  });
}
function closeLog() {
  const id = logJobId;
  logModal.hidden = true;
  logJobId = null;
  toggleModalChrome(false);
  render();
  if (es) { es.close(); es = null; }
  // 弹框开着时暂停了轮询，关掉补一次；行会被刷新重建，所以等它落地后再按 id 还焦点
  loadJobs().then(() => { if (!logOpen()) logTrigger(id)?.focus(); });
}

$('#submit').onclick = async () => {

  }

  const pathVal = $('#inputPath')?.value.trim() || '';
  const inPath = picker?.getMode?.() === 'path';          // FilePicker「服务器路径」模式
  const fileList = treePick?.length ? [] : ($('#file')?.files ? [...$('#file').files] : []);
  const file = fileList[0];
  /* 防呆：服务器路径 / JSON 手改模式走纯 JSON 通道提交，multipart 附件字段
   * （@prj/@cps/@cfg）不会被携带——旧版静默丢弃造成「投影文件未生效」。 */
  if (inPath || jsonManual) {
    const nm = { prj: '投影文件', cps: '控制点 CSV', cfg: '简化配置 CSV' };
    const tip = {
      prj: '「投影」组请改用「服务器投影文件」浏览选取（proj.prjPath）',
      cps: '请把控制点内容粘贴到「控制点 CSV 文本」框',
      cfg: '请切回「⬆ 上传」模式提交',
    };
    const picked = Object.keys(nm).filter((k) => $('#paramForm').querySelector(`[data-k="@${k}"]`)?.files?.[0]);
    if (picked.length) {
      const mode = jsonManual ? 'JSON 手改' : '服务器路径';
      showMsg(`「${mode}」模式不携带上传附件（已选但不会生效：${picked.map((k) => nm[k]).join('、')}）——`
        + picked.map((k) => tip[k]).join('；'), 'err');
      toast(`${mode} 模式下上传附件不会生效`, 'err', 5200);
      return;
    }
  }
  const btn = $('#submit'); btn.disabled = true;
  const old = btn.textContent; btn.textContent = ''; btn.append(el('span', { class: 'spinner' }), ' 提交中…');
  let res;
  const form = $('#paramForm');
  const appendAux = (fd) => {
    for (const k of ['prj', 'cps', 'cfg']) {
      const f = form.querySelector(`[data-k="@${k}"]`)?.files?.[0];
      if (f) fd.append(k, f, f.name);
    }
  };
  const sendLocalPath = async () => {
    const jbody = { ...params };
    const paths = type === 'tiles' ? pathVal.split(',').map((s) => s.trim()).filter(Boolean) : [];
    if (paths.length > 1) jbody.inputPaths = paths; else jbody.inputPath = pathVal;
    // 仅 mesh 有模型路径消歧框；tiles 单路径指向文件夹时由服务端自动全选全部模型
    if (type === 'mesh') {
      const mp = $('#modelPaths')?.value.trim();
      if (mp) jbody.modelPaths = mp.split(',').map((s) => s.trim()).filter(Boolean);
    }
    return fetch('/api/v1/jobs', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(jbody) });
  };
  try {
    if (inPath) {
      if (!pathVal) { showMsg('请填写服务器本地路径，或点「📂 浏览…」选择', 'err'); toast('路径为空', 'err', 2600); return; }
      res = await sendLocalPath();
    } else if (type === 'osgb' && !jsonManual && treePick?.length) {
      // ---- OSGB 文件夹（拖入或目录选择器）：逐文件携带相对路径，服务端重建树 ----
      const fd = new FormData();
      const rels = treePick.map((t) => t.rel);
      fd.append('options', JSON.stringify({ ...params, relPaths: rels, dirName: String(rels[0]).split('/')[0] || 'osgb' }));
      treePick.forEach((t, i) => fd.append('file', t.file, `f_${String(i + 1).padStart(6, '0')}`));
      appendAux(fd);
      res = await fetch('/api/v1/jobs', { method: 'POST', headers: {}, body: fd });
    } else if (type === 'osgb' && !jsonManual && file) {
      if (!/\.zip$/i.test(file.name)) {
        showMsg('OSGB 上传仅支持文件夹或 .zip——整目录请拖入/点「选文件夹」，超大目录用「服务器路径」模式', 'err');
        toast('OSGB 需要文件夹或 ZIP', 'err', 4200);
        return;
      }
      // ---- OSGB ZIP：服务端解压重建树 ----
      const fd = new FormData();
      fd.append('options', JSON.stringify({ ...params, dirName: file.name.replace(/\.zip$/i, '') || 'osgb' }));
      fd.append('file', file, file.name);
      appendAux(fd);
      res = await fetch('/api/v1/jobs', { method: 'POST', headers: {}, body: fd });
    } else if ((type === 'tiles' || type === 'mesh') && !jsonManual
      && (treePick?.length || /\.zip$/i.test(file?.name ?? ''))) {
      if (!treePick?.length && fileList.length > 1) {
        showMsg('ZIP 文件树不能与其他文件混选——请只选 ZIP，或只选模型文件（可多选）', 'err');
        toast('混选了 ZIP 与模型文件', 'err', 3200);
        return;
      }
      // ---- 文件树通道：文件夹（relPaths 重建，含子目录贴图）或 模型+贴图 ZIP ----
      const fd = new FormData();
      const opts = { ...params };
      if (treePick?.length) opts.relPaths = treePick.map((t) => t.rel);
      const mp = $('#modelPaths')?.value.trim();
      if (mp) opts.modelPaths = mp.split(',').map((s) => s.trim()).filter(Boolean);
      fd.append('options', JSON.stringify(opts));
      if (treePick?.length) treePick.forEach((t, i) => fd.append('file', t.file, `f_${String(i + 1).padStart(6, '0')}`));
      else fd.append('file', file, file.name);
      appendAux(fd);
      res = await fetch('/api/v1/jobs', { method: 'POST', headers: {}, body: fd });
    } else if (file && !jsonManual) {
      const fd = new FormData();
      fd.append('options', JSON.stringify(params));
      // tiles：全部选中文件一次上传（服务端统一参数逐个转换后合并）
      for (const f of (type === 'tiles' ? fileList : [file])) fd.append('file', f, f.name);
      appendAux(fd);
      res = await fetch('/api/v1/jobs', { method: 'POST', headers: {}, body: fd });
    } else if (!jsonManual) {
      showMsg('请选择输入（文件 / ZIP / 文件夹），或切换到「🖥 服务器路径」', 'err');
      toast('未选择输入', 'err', 2600);
      return;
    } else {
      // JSON 手改模式：沿用「服务器本地路径」提交
      if (!pathVal) { showMsg('JSON 模式仅支持「服务器本地路径」输入（切到「服务器路径」模式填写）', 'err'); return; }
      res = await sendLocalPath();
    }
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      const txt = body?.error
        ? `${body.error.code}: ${body.error.message}` + (body.error.details ? '\n' + JSON.stringify(body.error.details) : '')
        : `提交失败 (HTTP ${res.status})`;
      showMsg(txt, 'err');
      toast(`提交失败：${body?.error?.message || 'HTTP ' + res.status}`, 'err', 5000);
      return;
    }
    // 新任务只可能出现在第 1 页：先回到首页再乐观插入，随后拉服务端首页覆盖本地
    page = 1; pendingNew = 0;
    jobs.set(body.id, body); if (jobsTotal != null) jobsTotal += 1; render();
    openLog(body.id); loadJobs();
    showMsg(`任务已提交：${body.id.slice(0, 8)}`, 'ok');
    toast('任务已提交，正在处理…', 'ok');
  } catch (err) {
    // 网络中断/服务不可达时 fetch 会 reject——旧代码 try/finally 没有 catch，
    // 异常变成未处理的 Promise rejection，按钮虽然复原了用户却看不到任何提示。
    const what = String(err?.message ?? err);
    showMsg('提交失败（网络/服务异常）：' + what, 'err');
    toast('提交失败：' + what, 'err', 5200);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
};

/* ================ init ================ */
$('#type').append(...['tiles', 'terrain', 'image', 'geojson', 'mesh', 'osgb']
  .map(t => el('option', { value: t }, `${ICONS[t]} ${t} · ${TYPE_CN[t]}`)));
$('#type').onchange = () => {
  const t = $('#type').value;
  $('#typeDesc').textContent = DESC[t];
  exitJsonManual();   // JSON 手改内容属于旧类型，切换后不得再「以此为准」
  renderInputArea(t); renderForm(t);
};
async function probeCaps() {
  const pill = $('#health');
  try {
    caps = await (await fetch('/api/v1/capabilities')).json();
    pill.classList.remove('offline'); pill.classList.add('online');
    pill.innerHTML = `<i></i><span class="hide-sm">在线 · </span><span>${caps.jobTypes.length} 种任务类型</span>`;
    if (!caps.features.osgb) $('#type').querySelector('[value=osgb]')?.remove();
    if (caps.client?.canManageWhitelist) $('#wlLink').style.display = '';
    ipNote();
    return true;
  } catch {
    caps = null;
    const n = $('#ipNote');
    if (n && !n.innerHTML.includes('IP <b')) n.textContent = 'IP 授权状态未知（服务不可达）';
    pill.classList.remove('online'); pill.classList.add('offline');
    pill.innerHTML = '<i></i><span>服务不可达，自动重试…</span>';
    return false;
  }
}
await probeCaps();
$('#type').value = 'tiles';
$('#type').onchange();
await loadJobs();
setInterval(async () => {
  // 每轮都探测健康：loadJobs 的失败被静默吞掉，不能据它判断在线
  const wasOffline = !$('#health').classList.contains('online');
  const ok = await probeCaps();
  if (!ok) return;                                  // 仍离线：健康探针已负责提示与重试
  if (logOpen()) return;                            // 弹框开着不打扰列表，关闭时 closeLog 会补一次
  if (wasOffline || page === 1) loadJobs();         // 刚恢复在线 / 停在首页：整页重取
  else probeTotal();                                // 停在后面的页：只探新增，不重排正在看的内容
}, 5000);
</script>
