<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGO 任务控制台</title>
<link rel="stylesheet" href="/css/console.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">M</div>
    <h1>MGO 任务控制台</h1>
    <span class="ver">v0.7.1</span>
  </div>
  <div class="headRight">
    <span class="pill" id="health"><i></i><span>连接中…</span></span>
    <a class="linkBtn" id="wlLink" href="/whitelist.html" style="display:none" title="仅服务器本机可修改">⚙ 白名单</a>
    <a class="linkBtn" href="/viewer.html" target="_blank">🗺 打开查看器</a>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panelHead"><h3>新建处理任务</h3><span class="tag">*</span></div>

    <div class="hint" id="ipNote" style="margin-bottom:6px">检查 IP 授权…</div>

    <label>任务类型</label>
    <select id="type"></select>
    <div class="typeDesc hint" id="typeDesc"></div>

    <div id="inputArea"></div>

    <form id="paramForm" onsubmit="return false"></form>

    <details class="mini" id="jsonGrp">
      <summary><span class="chev">▶</span> ⚙ JSON 参数：<span id="jsonModeLabel">预览（只读）</span></summary>
      <textarea id="jsonBox" spellcheck="false" readonly></textarea>
    </details>

    <div class="submitRow">
      <button id="submit">▶ 提交任务</button>
    </div>
    <div id="msg"></div>
  </section>

  <section class="panel">
    <div class="panelHead">
      <h3>任务列表</h3>
      <button id="refreshBtn" class="linkBtn" style="margin-left:auto">⟳ 刷新</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="scrollx">
      <table>
        <thead><tr><th>任务</th><th>类型</th><th>状态</th><th>进度</th><th class="c-input">输入</th><th>操作</th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<!-- 任务日志：悬浮模态弹框（原先排在任务表末尾，50 行时点开根本看不见） -->
<div class="modal" id="logModal" hidden>
  <div class="mask" id="logMask"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="logTitle" tabindex="-1" id="logDialog">
    <div class="logHead">
      <h4 id="logTitle">任务日志</h4>
      <span class="badge s-running mono" id="logJob"></span>
      <span class="sp">
        <button id="copyLogBtn" title="复制全部日志到剪贴板">⧉ 复制</button>
        <button id="closeLogBtn" title="关闭（Esc）">✕ 关闭</button>
      </span>
    </div>
    <div id="logBox" role="log" tabindex="0" aria-label="任务日志输出（可用方向键滚动）"></div>
  </div>
</div>

<div class="modal" id="fsModal" hidden>
  <div class="mask" id="fsMask"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="fsTitle" tabindex="-1" id="fsDialog"
       style="width:min(680px,100%)">
    <div class="logHead">
      <h4 id="fsTitle">🖥 选择服务器文件</h4>
      <span class="sp"><button id="fsCloseBtn" title="关闭（Esc）">✕ 关闭</button></span>
    </div>
    <div class="fsCwd" id="fsCwd">加载中…</div>
    <div class="fsCrumbs" id="fsCrumbs" hidden></div>
    <div class="fsBar">
      <input type="text" id="fsFilter" placeholder="⌕ 过滤当前目录（快捷键 /）" autocomplete="off" spellcheck="false">
      <label id="fsOnlyWrap"><input type="checkbox" id="fsOnlyOk" checked>只看可选</label>
    </div>
    <div class="fsList" id="fsList" role="listbox" tabindex="0"></div>
    <div class="fsFtr">
      <button id="fsUseDir" class="btn">📂 选择当前文件夹</button>
      <button id="fsConfirm" class="btn primary" hidden>＋ 加入选中 (<span id="fsSelN">0</span>)</button>
      <button id="fsClear" class="btn" hidden>清空已选</button>
      <span class="hint" id="fsHint" style="margin-left:auto"></span>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script type="module" src="/js/console-main.js"></script>
</body>
</html>
