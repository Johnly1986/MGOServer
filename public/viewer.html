<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGO Cesium 查看器</title>
<link rel="stylesheet" href="/css/viewer.css">
</head>
<body>
<div id="cesiumContainer"></div>

<div id="boot"><div class="ring"></div><div id="bootText">正在加载 Cesium 引擎…</div></div>

<div id="toolbar">
  <button id="hudToggle" title="显示/隐藏面板">☰</button>
  <button id="home" title="复位视角 (H)">⌂</button>
  <button id="shot" title="保存截图 (PNG)">📷</button>
  <button id="fs" title="全屏">⛶</button>
</div>

<div id="hud">
  <h3><span class="dot"></span>MGO 查看器
    <span style="margin-left:auto;font-size:11.5px;font-weight:400"><a href="/console.html">控制台 ↗</a></span>
  </h3>

  <div id="layerWrap" class="sec" style="display:none">
    <b>已加载图层 · 点击定位</b>
    <ul id="layerList"></ul>
  </div>

  <div class="sec">
    <b>底图影像（免费在线源，可关）</b>
    <select id="basemap">
      <option value="esri_img">🛰 卫星影像 (Esri)</option>
      <option value="esri_street">🗺 街道地图 (Esri)</option>
      <option value="osm">🧭 OSM 标准地图</option>
      <option value="carto_dark">🌙 Carto 深色</option>
      <option value="carto_light">☀️ Carto 浅色</option>
      <option value="topo">⛰ OpenTopoMap 地形</option>
      <option value="none">无底图（纯色地球）</option>
    </select>
  </div>

  <div class="sec">
    <b>在线地形（全球高程，可关）</b>
    <select id="terrain">
      <option value="none">无（平滑椭球）</option>
      <option value="reearth">🌍 Re:Earth 全球地形</option>
    </select>
  </div>

  <div class="sec">
    <b>加载任务成果</b>
    <div class="row">
      <select id="type">
        <option value="3dtiles">3D Tiles 三维瓦片</option>
        <option value="terrain">地形切片（out 目录）</option>
        <option value="imagery">影像瓦片（out 目录）</option>
        <option value="geojson">GeoJSON 矢量</option>
        <option value="model">glTF 模型（.glb）</option>
      </select>
    </div>
    <input id="asset" placeholder="/ws/&lt;jobId&gt;/out/tileset.json">
    <div class="row">
      <button id="load">加载图层</button>
      <button id="fit" class="ghost">飞到结果</button>
      <button id="clear" class="danger">清空</button>
    </div>
  </div>

  <div id="status">初始化中…</div>

  <div class="credit">
    <span><b>左键</b>旋转</span><span><b>滚轮</b>缩放</span><span><b>右键</b>平移</span><span><b>点击构件</b>查看属性</span>
    <span id="credit" style="margin-left:auto;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>
</div>

<div id="featPanel" hidden role="complementary" aria-label="构件属性">
  <div class="fh"><b id="featTitle">构件属性</b><span class="tagx" id="featTag"></span>
    <span class="fx" id="featClose" title="关闭（Esc）">✕</span></div>
  <div id="featBody"></div>
  <div class="ff">
    <button id="featCopy" class="ghost" title="以 JSON 复制到剪贴板">⧉ 复制</button>
    <span style="margin-left:auto">Esc 关闭 · 点击其他构件切换</span>
  </div>
</div>

<div id="bar">已加载图层 <span class="n" id="layerCount">0</span></div>
<div id="coord"></div>

<script src="/js/viewer-hud.js"></script>

<script type="module" src="/js/viewer-main.js"></script>
</body>
</html>
