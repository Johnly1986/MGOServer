name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: unit + e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The suite drives a stub binary (test/fixtures/fake-mgo.sh) through the real
      # job pipeline, so no vcpkg/CMake/Assimp build is required here.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - run: node --version
