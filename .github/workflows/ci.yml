name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: unit + e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The suite drives a stub binary (test/fixtures/fake-mgo.sh) through the real
      # job pipeline, so no vcpkg/CMake/Assimp build is required here.
      # - .npmrc pins the official registry; the lockfile no longer bakes in any
      #   host (it used to point at a cloud-internal mirror unreachable from CI,
      #   which is why installs half-failed and e2e could not import yazl).
      # - Runner egress IPs are rate-limited by the npm registry (93 packages took
      #   ~71s vs ~3s on a dev box, and one install died of retry exhaustion).
      #   Fewer sockets + longer retries ride it out; --no-audit/--no-fund drop
      #   two extra registry round-trips.
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund --maxsockets=3 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=90000 2>&1 | tee /tmp/npm-ci.log

      - name: Test
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      # postinstall placed the self-contained engine in build/bin/linux/ — smoke
      # the real release asset on every PR: it once shipped broken RUNPATHs and
      # a missing proj.db, none of which the stub-driven suite can see.
      - name: Real engine smoke
        run: |
          set -e
          node --input-type=module -e "
            import { probeMgo } from './src/mgo.js';
            const i = await probeMgo('build/bin/linux/MGOConsole');
            if (!i.found) throw new Error('engine probe failed: ' + JSON.stringify(i));
            console.log('engine', JSON.stringify(i));
          "
          printf '{"type":"Point","coordinates":[500000,3300000]}' > /tmp/in.geojson
          PROJ_DATA="$PWD/build/bin/linux/share/proj" \
            build/bin/linux/MGOConsole geojson -i /tmp/in.geojson -o /tmp/out.geojson \
            --source-crs EPSG:4547 --target-crs EPSG:4326
          grep -q '"coordinates":\[114' /tmp/out.geojson && echo "EPSG conversion ok"

      - run: node --version

