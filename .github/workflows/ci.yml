name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: unit + e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The suite drives a stub binary (test/fixtures/fake-mgo.sh) through the real
      # job pipeline, so no vcpkg/CMake/Assimp build is required here.
      # - .npmrc pins the official registry; the lockfile no longer bakes in any
      #   host (it used to point at a cloud-internal mirror unreachable from CI,
      #   which is why installs half-failed and e2e could not import yazl).
      # - Runner egress IPs are rate-limited by the npm registry (93 packages took
      #   ~71s vs ~3s on a dev box, and one install died of retry exhaustion).
      #   Fewer sockets + longer retries ride it out; --no-audit/--no-fund drop
      #   two extra registry round-trips.
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund --maxsockets=3 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=90000 2>&1 | tee /tmp/npm-ci.log

      - name: Test
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      - run: node --version

      # --- 临时诊断：失败时把日志尾部转成注解/summary（可用 API 匿名读取），定位后移除 ---
      - name: Report install failure (temporary)
        if: failure() && steps.install.conclusion == 'failure'
        run: |
          tail -c 12000 /tmp/npm-ci.log >> "$GITHUB_STEP_SUMMARY" || true
          tail -c 10 /tmp/npm-ci.log 2>/dev/null | head -c 1 >/dev/null
          tail -n 8 /tmp/npm-ci.log | sed 's/^/::error::/'

      - name: Report test failure (temporary)
        if: failure() && steps.test.conclusion == 'failure'
        run: |
          {
            echo '### npm test log (tail 12k)'
            echo '```'
            tail -c 12000 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -c 3500 /tmp/test.log | python3 -c "import sys;sys.stdout.write('::error::'+sys.stdin.read().replace(chr(10),'%0A')[:3600])"
